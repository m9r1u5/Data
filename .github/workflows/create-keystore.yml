name: Create signing key (run once)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EXISTING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$EXISTING" ]; then
            echo "::error::KEYSTORE_BASE64 already exists. A new key would stop updates installing over the old app. Delete that secret first only if you really want a new key."
            exit 1
          fi
          if [ ${#KEYSTORE_PASSWORD} -lt 8 ]; then
            echo "::error::Add a repository secret called KEYSTORE_PASSWORD (at least 8 characters) first."
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore release.jks -storetype PKCS12 \
            -alias datatracker -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Data Tracker, O=m9r1u5, C=ZA"
          base64 -w 0 release.jks > KEYSTORE_BASE64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: KEYSTORE_BASE64.txt
          retention-days: 1
